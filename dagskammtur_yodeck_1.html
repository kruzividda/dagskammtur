<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=721, height=1080">
<title>Dagskammtur – Matseðill Dagsins</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#F5EFE0; --dark:#1A1510; --rust:#C4521A; --gold:#D4A843;
    --sage:#6B7C5E; --warm-gray:#8C7E6E; --card-bg:#FFFDF7; --border:rgba(196,82,26,0.15);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html, body {
    width:721px; height:1080px;
    overflow:hidden;
    background:var(--cream);
    color:var(--dark);
    font-family:'DM Sans',sans-serif;
  }

  .screen {
    width:721px; height:1080px;
    display:flex; flex-direction:column;
    position:relative;
  }

  /* Decorative circle */
  .screen::after {
    content:''; position:absolute;
    width:400px; height:400px; border-radius:50%;
    background:radial-gradient(circle,rgba(212,168,67,0.1) 0%,transparent 70%);
    top:-100px; right:-80px; pointer-events:none; z-index:0;
  }

  /* ── HEADER ── */
  header {
    flex-shrink:0;
    padding:24px 28px 16px;
    border-bottom:1px solid var(--border);
    position:relative; z-index:1;
    display:flex; flex-direction:column; gap:6px;
  }

  .logo-text { display:none; }

  .header-bottom {
    display:flex; align-items:flex-end; justify-content:space-between;
  }

  .tagline {
    font-family:'Playfair Display',serif;
    font-size:2rem; font-weight:900;
    color:var(--dark); letter-spacing:-0.01em;
  }

  .date-area { text-align:right; }
  .day-name {
    font-family:'Playfair Display',serif;
    font-size:1.9rem; font-weight:700;
    color:var(--rust); line-height:1;
  }
  .full-date {
    font-size:0.65rem; color:var(--warm-gray);
    text-transform:uppercase; letter-spacing:0.1em; margin-top:2px;
  }

  /* ── MAIN CONTENT ── */
  .menu-area {
    flex:1; min-height:0;
    display:flex; flex-direction:column;
    padding:14px 28px 10px;
    gap:10px;
    position:relative; z-index:1;
    overflow:hidden;
  }

  .section-label {
    font-size:0.6rem; font-weight:500;
    text-transform:uppercase; letter-spacing:0.18em;
    color:var(--warm-gray);
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
  }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  /* 2-column grid for portrait */
  .menu-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    flex:1; min-height:0;
  }

  .menu-card {
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 13px;
    display:flex; flex-direction:column; gap:5px;
    position:relative; overflow:hidden;
    opacity:0; transform:translateY(12px);
    animation:cardIn 0.4s ease forwards;
  }
  .menu-card:nth-child(1){animation-delay:.03s}.menu-card:nth-child(2){animation-delay:.06s}
  .menu-card:nth-child(3){animation-delay:.09s}.menu-card:nth-child(4){animation-delay:.12s}
  .menu-card:nth-child(5){animation-delay:.15s}.menu-card:nth-child(6){animation-delay:.18s}
  .menu-card:nth-child(7){animation-delay:.21s}.menu-card:nth-child(8){animation-delay:.24s}
  @keyframes cardIn{to{opacity:1;transform:translateY(0);}}

  .menu-card::before {
    content:''; position:absolute;
    top:0; left:0; right:0; height:3px;
    border-radius:10px 10px 0 0;
  }
  .c-fish::before      {background:linear-gradient(90deg,#5B8DB8,#82B4D4);}
  .c-meat::before      {background:linear-gradient(90deg,var(--rust),#E07A4A);}
  .c-veggie::before    {background:linear-gradient(90deg,var(--sage),#8EA980);}
  .c-salad::before     {background:linear-gradient(90deg,#7DAF6B,#A8CC98);}
  .c-burger::before    {background:linear-gradient(90deg,var(--gold),#E8C06A);}
  .c-fishraspi::before {background:linear-gradient(90deg,#5B8DB8,#82B4D4);}
  .c-caesar::before    {background:linear-gradient(90deg,#8EA068,#B2C490);}
  .c-nostalgia::before {background:linear-gradient(90deg,#A07850,#C8A07A);}

  .card-type {
    font-size:1.05rem; font-weight:700;
    text-transform:uppercase; letter-spacing:0.08em;
  }
  .c-fish .card-type      {color:#5B8DB8;}
  .c-meat .card-type      {color:var(--rust);}
  .c-veggie .card-type    {color:var(--sage);}
  .c-salad .card-type     {color:#5F8F4D;}
  .c-burger .card-type    {color:#B8882A;}
  .c-fishraspi .card-type {color:#5B8DB8;}
  .c-caesar .card-type    {color:#6A884E;}
  .c-nostalgia .card-type {color:#7A5830;}

  .card-title {
    font-size:1.18rem; font-weight:400;
    color:var(--dark); line-height:1.4; flex:1;
  }

  .veggie-badge {
    display:inline-block; background:var(--sage); color:white;
    font-size:0.48rem; font-weight:700; padding:1px 4px;
    border-radius:3px; vertical-align:middle; margin-left:3px;
  }

  /* ── SOUP ── */
  .soup-bar {
    flex-shrink:0;
    display:flex; align-items:center; gap:14px;
    padding:11px 18px;
    background:linear-gradient(135deg,rgba(212,168,67,0.13),rgba(212,168,67,0.05));
    border:1px solid rgba(212,168,67,0.3);
    border-radius:10px;
    opacity:0; animation:cardIn 0.4s ease 0.3s forwards;
    position:relative; z-index:1;
    margin:0 28px;
  }
  .soup-icon {font-size:1.4rem;}
  .soup-label {font-size:0.88rem;font-weight:500;text-transform:uppercase;letter-spacing:0.14em;color:var(--gold);margin-bottom:1px;}
  .soup-name {font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:700;color:var(--dark);}

  /* ── FOOTER ── */
  footer {
    flex-shrink:0;
    padding:9px 28px;
    border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    position:relative; z-index:1;
  }
  .footer-left {font-size:0.62rem;color:var(--warm-gray);}
  .dot {width:3px;height:3px;border-radius:50%;background:var(--rust);display:inline-block;margin:0 6px;vertical-align:middle;}
  .footer-right {font-size:0.6rem;color:var(--warm-gray);opacity:0.5;}
  .refresh-bar {position:absolute;bottom:0;left:0;height:2px;background:var(--rust);opacity:0.35;width:100%;transform-origin:left;}
  .fallback-note{font-size:0.55rem;color:var(--warm-gray);opacity:0.5;font-style:italic;}

  /* ── STATES ── */
  .center-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;position:relative;z-index:1;}
  .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--rust);border-radius:50%;animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .state-icon{font-size:2.4rem;}
  .state-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--rust);}
  .state-sub{color:var(--warm-gray);font-size:0.82rem;text-align:center;padding:0 20px;}
</style>
</head>
<body>
<div class="screen">

  <header>
    <div class="logo-text">Dag<span>skammtur</span></div>
    <div class="header-bottom">
      <div class="tagline">Matseðill Dagsins</div>
      <div class="date-area">
        <div class="day-name" id="day-name">—</div>
        <div class="full-date" id="full-date">—</div>
      </div>
    </div>
  </header>

  <div id="main" style="flex:1;min-height:0;display:flex;flex-direction:column;">
    <div class="center-state">
      <div class="spinner"></div>
      <div class="state-sub">Sæki matseðil...</div>
    </div>
  </div>

  <div id="soup-slot"></div>

  <footer>
    <div class="footer-left">dagskammtur.is<span class="dot"></span>Stórhöfða 44<span class="dot"></span>553 1617</div>
    <div class="footer-right" id="footer-right"></div>
    <div class="refresh-bar" id="refresh-bar"></div>
  </footer>

</div>
<script>
const DAYS_IS   = ["Sunnudagur","Mánudagur","Þriðjudagur","Miðvikudagur","Fimmtudagur","Föstudagur","Laugardagur"];
const MONTHS_IS = ["janúar","febrúar","mars","apríl","maí","júní","júlí","ágúst","september","október","nóvember","desember"];
const DAY_TO_TAB = {1:0,2:1,3:2,4:3,5:4};
const REFRESH_MS = 12 * 60 * 60 * 1000;

const FALLBACK = {
  label:'11–15 maí 2026',
  1:{fish:'Fiskibollur, kartöflur, brokkolí, blómkál, gulrætur og lauksmjör',meat:'Lambakjöt í karrí, hrísgrjón og grænmeti',veggie:'Kjúklingabaunabuff, steikt grænmeti, kartöflur og blaðlaukssósa',salad:'Salat með chili-marineruðum rækjum, lárperu, tómötum og chili mæjó',burger:'Hamborgari með osti, káli, tómat, pikkluðum rauðlauk og sinnepssósu, franskar og kokteilsósa',fishraspi:'Fiskur í raspi, sítróna, franskar og kokteilssósa',caesar:'Salatblanda, kjúklingur, tómatar, gúrka, parmesan, brauðteningar og sesardressing',nostalgia:'Saltað hrossakjöt, kartöflumús og grænar baunir',soup:'Rjómalöguð paprikusúpa'},
  2:{fish:'Steikt ýsa, steinseljukartöflur, grænmeti, ólífur og hvítlaukssmjör',meat:'Beinlaus kjúklingalæri, sætkartöflumús, sveppir, brokkolí og döðlusósa',veggie:'Penne pasta með sveppum, papriku, brokkolí, rjóma-hvítlaukssósu og hvítlauksbrauð',salad:'Salat með piri piri kjúkling, edamame baunum, papriku, sætum kartöflum og jógúrtsósu',burger:'Hamborgari með osti, káli, tómat, pikkluðum rauðlauk og sinnepssósu, franskar og kokteilsósa',fishraspi:'Fiskur í raspi, sítróna, franskar og kokteilssósa',caesar:'Salatblanda, kjúklingur, tómatar, gúrka, parmesan, brauðteningar og sesardressing',nostalgia:'Saltað hrossakjöt, kartöflumús og grænar baunir',soup:'Grænmetissúpa'},
  3:{fish:'Gratíneraðir sjávarréttir í brauðkænu, krydduð hrísgrjón og grænmeti',meat:'Purusteik, brúnaðar kartöflur, grænmeti, rauðkál og rauðvínssósa',veggie:'Bökuð sætkartafla með hnetu og döðlufyllingu, ristað grænkál, grænmeti og sveppasósa',salad:'Salat með falafel bollum, melónu, sólþurrkuðum tómötum, parmesan og balsamic dressingu',burger:'Hamborgari með osti, káli, tómat, pikkluðum rauðlauk og sinnepssósu, franskar og kokteilsósa',fishraspi:'Fiskur í raspi, sítróna, franskar og kokteilssósa',caesar:'Salatblanda, kjúklingur, tómatar, gúrka, parmesan, brauðteningar og sesardressing',nostalgia:'Saltað hrossakjöt, kartöflumús og grænar baunir',soup:'Tómatsúpa'},
  4:{fish:'LOKAÐ',meat:'',veggie:'',salad:'',burger:'Hamborgari með osti, káli, tómat, pikkluðum rauðlauk og sinnepssósu, franskar og kokteilsósa',fishraspi:'Fiskur í raspi, sítróna, franskar og kokteilssósa',caesar:'Salatblanda, kjúklingur, tómatar, gúrka, parmesan, brauðteningar og sesardressing',nostalgia:'',soup:'Sveppasúpa'},
  5:{fish:'Langa í kryddjurtamarineringu með smælkikartöflum, grænmeti og hvítvínssósu',meat:'Kjúklingapasta með papriku, blaðlauk, beikoni og hvítlauks-rjómaostasósu og hvítlauksbrauð',veggie:'Blómkálstaco með mangósalsa og avocado lime sósu og hrísgrjónasalat',salad:'Salat með núðlum, eggjum, brokkolí, gulrætur og teriaky dressingu',burger:'Hamborgari með osti, káli, tómat, pikkluðum rauðlauk og sinnepssósu, franskar og kokteilsósa',fishraspi:'Fiskur í raspi, sítróna, franskar og kokteilssósa',caesar:'Salatblanda, kjúklingur, tómatar, gúrka, parmesan, brauðteningar og sesardressing',nostalgia:'Saltað hrossakjöt, kartöflumús og grænar baunir',soup:'Sveppasúpa'},
};

const CARDS = [
  {key:'fish',      cls:'c-fish',      label:'🐟 Fiskréttur',      veggie:false},
  {key:'meat',      cls:'c-meat',      label:'🥩 Kjötréttur',      veggie:false},
  {key:'veggie',    cls:'c-veggie',    label:'🥦 Grænmetisréttur', veggie:true},
  {key:'salad',     cls:'c-salad',     label:'🥗 Salatréttur',     veggie:false},
  {key:'burger',    cls:'c-burger',    label:'🍔 Hamborgari',      veggie:false},
  {key:'fishraspi', cls:'c-fishraspi', label:'🐠 Fiskur í raspi',  veggie:false},
  {key:'caesar',    cls:'c-caesar',    label:'🥬 Sesarsalat RDS',  veggie:false},
  {key:'nostalgia', cls:'c-nostalgia', label:'🍲 Nostalgía',       veggie:false},
];

async function timedFetch(url, asJson, ms=8000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, {cache:'no-store', signal:ctrl.signal});
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP '+r.status);
    return asJson ? r.json() : r.text();
  } catch(e) { clearTimeout(timer); throw e; }
}

async function fetchMenuHTML() {
  const enc = encodeURIComponent('https://dagskammtur.is/matsedill/');
  try {
    const j = await timedFetch(`https://api.allorigins.win/get?url=${enc}&t=${Date.now()}`, true);
    if (j && j.contents && j.contents.length > 500) return j.contents;
  } catch(e) {}
  try {
    const t = await timedFetch(`https://corsproxy.io/?url=${enc}`, false);
    if (t && t.length > 500) return t;
  } catch(e) {}
  try {
    const t = await timedFetch(`https://api.codetabs.com/v1/proxy?quest=https://dagskammtur.is/matsedill/`, false);
    if (t && t.length > 500) return t;
  } catch(e) {}
  return null;
}

function parseMenuHTML(html, tabIndex) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const h3s = Array.from(doc.querySelectorAll('h3'));
  const slice = h3s.slice(tabIndex * 9, tabIndex * 9 + 9);
  if (slice.length < 9) return null;
  function next(h3) {
    let el = h3.nextElementSibling;
    while (el && el.tagName !== 'H3') {
      const t = el.textContent.trim();
      if (t) return t;
      el = el.nextElementSibling;
    }
    return '';
  }
  return {
    fish:next(slice[0]),meat:next(slice[1]),veggie:next(slice[2]),
    salad:next(slice[3]),burger:next(slice[4]),fishraspi:next(slice[5]),
    caesar:next(slice[6]),nostalgia:next(slice[7]),
    soup:next(slice[8]).replace(/\*/g,'').trim(),
  };
}

function buildMenu(data, isLive) {
  const note = isLive ? '' : ` <span class="fallback-note">· vistuð gögn ${FALLBACK.label}</span>`;
  const cards = CARDS.map(c=>`
    <div class="menu-card ${c.cls}">
      <div class="card-type">${c.label}${c.veggie?'<span class="veggie-badge">V</span>':''}</div>
      <div class="card-title">${data[c.key]||'—'}</div>
    </div>`).join('');
  return `<div class="menu-area">
    <div class="section-label">Réttir dagsins${note}</div>
    <div class="menu-grid">${cards}</div>
  </div>`;
}

async function main() {
  const now = new Date();
  const day = now.getDay();

  document.getElementById('day-name').textContent = DAYS_IS[day];
  document.getElementById('full-date').textContent =
    `${now.getDate()}. ${MONTHS_IS[now.getMonth()]} ${now.getFullYear()}`;
  document.getElementById('footer-right').textContent =
    `Uppfært: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const mainEl = document.getElementById('main');
  const soupSlot = document.getElementById('soup-slot');

  if (day === 0 || day === 6) {
    mainEl.innerHTML = `<div class="center-state"><div class="state-icon">🏡</div><div class="state-title">Lokað um helgar</div><div class="state-sub">Matseðillinn er í boði mánudag til föstudags</div></div>`;
    scheduleRefresh(); return;
  }

  const tabIndex = DAY_TO_TAB[day];
  let data = null, isLive = false;
  const html = await fetchMenuHTML();
  if (html) {
    const parsed = parseMenuHTML(html, tabIndex);
    if (parsed && parsed.fish) { data = parsed; isLive = true; }
  }
  if (!data) data = FALLBACK[day] || null;

  if (data) {
    mainEl.innerHTML = buildMenu(data, isLive);
    soupSlot.innerHTML = `<div class="soup-bar">
      <div class="soup-icon">🍵</div>
      <div>
        <div class="soup-label">Súpa dagsins</div>
        <div class="soup-name">${data.soup||'—'}</div>
      </div>
    </div>`;
  } else {
    mainEl.innerHTML = `<div class="center-state"><div class="state-icon">⚠️</div><div class="state-title">Engar upplýsingar</div><div class="state-sub">Reyni aftur eftir 2 mínútur...</div></div>`;
    setTimeout(main, 2*60*1000); return;
  }

  scheduleRefresh();
}

function scheduleRefresh() {
  const bar = document.getElementById('refresh-bar');
  bar.style.transition = `transform ${REFRESH_MS/1000}s linear`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.transform='scaleX(0)'; }));
  setTimeout(()=>location.reload(), REFRESH_MS);
}

main();
</script>
</body>
</html>
